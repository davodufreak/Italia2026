<body>

    </svg>
    <span class="refresh-label">Actualizar</span>
  </button>

  <!-- ░░ SIDEBAR NAV (desktop) ░░ -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="nav-eyebrow">Guía de viaje</span>

    <div class="city-strip" id="cityStrip"></div>

    <ul class="nav-items">
      <li><button class="nav-btn active" data-section="resumen">

      </button></li>
      <li><button class="nav-btn" data-section="itinerario">

      </button></li>
      <li><button class="nav-btn" data-section="hospedajes">

    <button class="bnav-btn" data-section="itinerario"><span>◷</span><span>Itinerario</span></button>
    <button class="bnav-btn" data-section="hospedajes"><span>◻</span><span>Hospedajes</span></button>
    <button class="bnav-btn" data-section="traslados"><span>⟶</span><span>Traslados</span></button>
    <button class="bnav-btn" data-section="entradas"><span>◇</span><span>Entradas</span></button>
  </nav>

  <!-- Lógica del botón Actualizar — inline a propósito: debe funcionar
       aunque app.js esté servido desde una versión vieja en caché. -->
  <script>
  (function () {
    var btn = document.getElementById('refreshBtn');
    if (!btn) return;

    btn.addEventListener('click', function () {
      if (btn.classList.contains('is-loading')) return;
      btn.classList.remove('is-error');
      btn.classList.add('is-loading');

      var stamp = Date.now();
      var assets = ['data.js', 'app.js', 'styles.css', 'index.html'];

      Promise.resolve()
        // 1. Vaciar Cache Storage (si el navegador lo expone)
        .then(function () {
          if (!('caches' in window)) return;
          return caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (k) { return caches.delete(k); }));
          });
        })
        // 2. Desregistrar service workers viejos
        .then(function () {
          if (!('serviceWorker' in navigator)) return;
          return navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (r) { return r.unregister(); }));
          });
        })
        // 3. Re-descargar los archivos saltándose la caché HTTP
        .then(function () {
          return Promise.all(assets.map(function (f) {
            return fetch(f + '?cb=' + stamp, { cache: 'reload' }).then(function (r) {
              if (!r.ok) throw new Error(f + ': ' + r.status);
            });
          }));
        })
        // 4. Recargar con parámetro nuevo para forzar HTML fresco
        .then(function () {
          var base = location.pathname.replace(/[?#].*$/, '');
          location.replace(base + '?v=' + stamp);
        })
        .catch(function () {
          // Sin conexión o el servidor no respondió: no recargamos,
          // para no dejar la pantalla en blanco.
          btn.classList.remove('is-loading');
          btn.classList.add('is-error');
          setTimeout(function () { btn.classList.remove('is-error'); }, 2600);
        });
    });
  })();
  </script>

  <script src="data.js?v=20260904182651"></script>
  <script src="app.js?v=20260904182651"></script>
</body>
</html>
